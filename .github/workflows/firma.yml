name: Firma semanal

# Corre cuando cambia semana.json (o el logo / el generador), todos los días a las 00:10 de Montevideo,
# y también se puede lanzar a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
    paths: [semana.json, generar.py, logo-grupocine.png, .github/workflows/firma.yml]
  workflow_dispatch:
  # Todos los días a las 00:10 de Montevideo: así el jueves cambia sola a la semana nueva.
  schedule:
    - cron: "10 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python generar.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: deploy
        uses: actions/deploy-pages@v4
